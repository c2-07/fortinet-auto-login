name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on any tag starting with 'v' e.g. v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Adjust version if needed, 1.21+ recommended

      - name: Get version info
        id: vars
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build binaries
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ env.VERSION }} -X main.commit=${{ env.COMMIT }} -X main.date=${{ env.DATE }}"
          
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/fortinet-auto-login-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/fortinet-auto-login-linux-arm64 .
          
          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/fortinet-auto-login-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/fortinet-auto-login-darwin-arm64 .
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/fortinet-auto-login-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/fortinet-auto-login-windows-arm64.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
