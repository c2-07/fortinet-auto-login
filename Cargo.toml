[package]
name = "fortinet-auto-login"
version = "1.0.0"
edition = "2021"
authors = ["c2-07"]
description = "A lightning-fast, zero-dependency CLI written in Rust that automates login, logout, network detection, and background keepalive for Fortinet FortiGate captive portals."

[[bin]]
name = "autologin"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
ureq = { version = "3.5", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
